services:
  - type: web
    name: python-password-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Exactly one worker: the vault key is held in that process's memory,
    # so a second worker would not share the unlocked session.
    startCommand: gunicorn --workers 1 --threads 4 app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: vault-data
      mountPath: /opt/render/project/src
      sizeGB: 1
